<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>验证成功 - Demu 账号</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-card" style="text-align:center;">
    <div class="brand">
      <div class="brand-logo"><span>Demu</span> 账号</div>
      <div class="brand-slogan">一个 Demu 账号，畅享全部服务</div>
    </div>

    <div class="result-icon">✅</div>
    <div class="result-title" id="title">邮箱验证成功</div>
    <div class="result-desc" id="desc">
      您的账号已激活，现在可以登录了
    </div>

    <a href="/login.html" class="btn btn-primary" style="text-decoration:none; display:flex; align-items:center; justify-content:center;">
      前往登录
    </a>
  </div>

  <script>
    // 如果是已激活的账号再次点击验证链接
    const params = new URLSearchParams(window.location.search);
    if (params.get('already') === '1') {
      document.getElementById('title').textContent = '账号已激活';
      document.getElementById('desc').textContent = '您的账号此前已完成验证，无需重复操作';
    }
  </script>
</body>
</html>

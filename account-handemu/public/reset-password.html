<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重置密码 - Demu账号</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --primary:#2563eb; --primary-hover:#1d4ed8; --primary-light:#dbeafe;
      --bg:#f1f5f9; --card:#ffffff; --text:#1e293b; --text2:#64748b;
      --border:#e2e8f0; --error:#ef4444; --success:#22c55e;
    }
    body {
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
      background:var(--bg); min-height:100vh; display:flex; align-items:center;
      justify-content:center; padding:24px;
    }
    .card {
      background:var(--card); border-radius:12px;
      box-shadow:0 4px 24px rgba(0,0,0,0.06);
      width:100%; max-width:420px; padding:40px 36px;
    }
    .brand { text-align:center; margin-bottom:28px; }
    .brand h2 { font-size:22px; font-weight:700; color:var(--text); }
    .brand h2 span { color:var(--primary); }
    .brand p { font-size:13px; color:var(--text2); margin-top:6px; }
    .form-group { margin-bottom:18px; }
    .form-group label {
      display:block; font-size:13px; font-weight:500;
      margin-bottom:6px; color:var(--text);
    }
    .form-group input {
      width:100%; height:42px; padding:0 14px; border:1px solid var(--border);
      border-radius:8px; font-size:14px; outline:none; transition:all 0.2s;
    }
    .form-group input:focus {
      border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-light);
    }
    .hint { font-size:12px; color:var(--text2); margin-top:4px; }
    .btn {
      width:100%; height:44px; border:none; border-radius:8px; font-size:14px;
      font-weight:600; cursor:pointer; transition:all 0.2s;
    }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-primary:hover { background:var(--primary-hover); }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
    .msg {
      padding:10px 14px; border-radius:8px; font-size:13px;
      margin-bottom:16px; display:none; line-height:1.5;
    }
    .msg.error {
      background:#fef2f2; color:var(--error);
      border:1px solid #fecaca; display:block;
    }
    .msg.success {
      background:#f0fdf4; color:var(--success);
      border:1px solid #bbf7d0; display:block;
    }
    .links { text-align:center; margin-top:20px; font-size:13px; }
    .links a { color:var(--primary); text-decoration:none; }
    .links a:hover { text-decoration:underline; }
    .strength-bar {
      height:4px; border-radius:2px; background:#e2e8f0;
      margin-top:8px; overflow:hidden;
    }
    .strength-bar .fill {
      height:100%; border-radius:2px; transition:all 0.3s; width:0;
    }
    .strength-text { font-size:11px; margin-top:4px; }

    .state-page { display:none; text-align:center; }
    .state-page .icon { font-size:48px; margin-bottom:16px; }
    .state-page h3 {
      font-size:18px; font-weight:600; margin-bottom:8px;
    }
    .state-page p {
      font-size:13px; color:var(--text2); line-height:1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h2><span>Demu</span>账号</h2>
      <p>一个Demu账号尽享翰德姆全部服务～</p>
    </div>

    <!-- 无 token 错误 -->
    <div id="errorState" class="state-page">
      <div class="icon">⚠️</div>
      <h3 style="color:var(--error);">链接无效</h3>
      <p>重置链接无效或已过期，请重新申请。</p>
      <div class="links" style="margin-top:24px;">
        <a href="/forgot-password.html">重新找回密码</a>
      </div>
    </div>

    <!-- 表单 -->
    <div id="formState">
      <div id="message" class="msg"></div>

      <form id="resetForm">
        <div class="form-group">
          <label for="password">新密码</label>
          <input type="password" id="password"
            placeholder="请输入新密码" required autofocus
            oninput="checkStrength()" />
          <div class="strength-bar">
            <div class="fill" id="strengthFill"></div>
          </div>
          <div class="strength-text" id="strengthText"></div>
          <div class="hint">至少 8 位，包含大小写字母和数字</div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">确认新密码</label>
          <input type="password" id="confirmPassword"
            placeholder="再次输入新密码" required />
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">
          重置密码
        </button>
      </form>

      <div class="links">
        <a href="/login.html">返回登录</a>
      </div>
    </div>

    <!-- 成功 -->
    <div id="successState" class="state-page">
      <div class="icon">✅</div>
      <h3 style="color:var(--text);">密码重置成功</h3>
      <p>你的密码已更新，请使用新密码登录。</p>
      <div class="links" style="margin-top:24px;">
        <a href="/login.html"
          style="display:inline-block;padding:10px 28px;background:#2563eb;
          color:#fff;border-radius:8px;text-decoration:none;font-weight:600;">
          去登录
        </a>
      </div>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var token = params.get('token');

    if (!token) {
      document.getElementById('formState').style.display = 'none';
      document.getElementById('errorState').style.display = 'block';
    }

    var form = document.getElementById('resetForm');
    var msg = document.getElementById('message');
    var submitBtn = document.getElementById('submitBtn');

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = 'msg ' + (type || 'error');
    }

    function hideMsg() {
      msg.className = 'msg';
      msg.textContent = '';
    }

    function checkStrength() {
      var pwd = document.getElementById('password').value;
      var score = 0;
      var fill = document.getElementById('strengthFill');
      var text = document.getElementById('strengthText');

      if (pwd.length >= 8) score++;
      if (pwd.length >= 12) score++;
      if (/[a-z]/.test(pwd)) score++;
      if (/[A-Z]/.test(pwd)) score++;
      if (/[0-9]/.test(pwd)) score++;
      if (/[^a-zA-Z0-9]/.test(pwd)) score++;

      var levels = [
        { min:0, color:'#e2e8f0', width:'0%', label:'' },
        { min:1, color:'#ef4444', width:'20%', label:'很弱' },
        { min:2, color:'#f59e0b', width:'40%', label:'较弱' },
        { min:3, color:'#f59e0b', width:'60%', label:'一般' },
        { min:4, color:'#22c55e', width:'80%', label:'较强' },
        { min:5, color:'#16a34a', width:'100%', label:'很强' }
      ];

      var level = levels[0];
      for (var i = levels.length - 1; i >= 0; i--) {
        if (score >= levels[i].min) { level = levels[i]; break; }
      }

      fill.style.width = level.width;
      fill.style.background = level.color;
      text.textContent = level.label;
      text.style.color = level.color;
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      hideMsg();

      var password = document.getElementById('password').value;
      var confirmPassword = document.getElementById('confirmPassword').value;

      if (password.length < 8) {
        showMsg('密码至少 8 位', 'error'); return;
      }
      if (!/[a-z]/.test(password) || !/[A-Z]/.test(password)
        || !/[0-9]/.test(password)) {
        showMsg('密码需包含大小写字母和数字', 'error'); return;
      }
      if (password !== confirmPassword) {
        showMsg('两次密码不一致', 'error'); return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '提交中...';

      try {
        var res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, password: password })
        });
        var data = await res.json();

        if (data.success) {
          document.getElementById('formState').style.display = 'none';
          document.getElementById('successState').style.display = 'block';
        } else {
          if (data.message.indexOf('过期') !== -1
            || data.message.indexOf('无效') !== -1) {
            document.getElementById('formState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
            document.querySelector('#errorState p').textContent = data.message;
          } else {
            showMsg(data.message, 'error');
          }
        }
      } catch (err) {
        showMsg('网络错误，请稍后重试', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '重置密码';
      }
    });
  </script>
</body>
</html>

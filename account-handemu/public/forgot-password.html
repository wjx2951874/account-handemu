<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>找回密码 - Demu账号</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --primary:#2563eb; --primary-hover:#1d4ed8; --primary-light:#dbeafe;
      --bg:#f1f5f9; --card:#ffffff; --text:#1e293b; --text2:#64748b;
      --border:#e2e8f0; --error:#ef4444; --success:#22c55e; --warning:#f59e0b;
    }
    body {
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
      background:var(--bg); min-height:100vh; display:flex; align-items:center;
      justify-content:center; padding:24px;
    }
    .card {
      background:var(--card); border-radius:12px;
      box-shadow:0 4px 24px rgba(0,0,0,0.06);
      width:100%; max-width:440px; padding:40px 36px;
    }
    .brand { text-align:center; margin-bottom:28px; }
    .brand h2 { font-size:22px; font-weight:700; color:var(--text); }
    .brand h2 span { color:var(--primary); }
    .brand p { font-size:13px; color:var(--text2); margin-top:6px; }
    .form-group { margin-bottom:18px; }
    .form-group label {
      display:block; font-size:13px; font-weight:500;
      margin-bottom:6px; color:var(--text);
    }
    .form-group input, .form-group select {
      width:100%; height:42px; padding:0 14px; border:1px solid var(--border);
      border-radius:8px; font-size:14px; outline:none; transition:all 0.2s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-light);
    }
    .hint {
      font-size:12px; color:var(--text2); margin-top:6px; line-height:1.5;
    }
    .btn {
      width:100%; height:44px; border:none; border-radius:8px; font-size:14px;
      font-weight:600; cursor:pointer; transition:all 0.2s;
    }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-primary:hover { background:var(--primary-hover); }
    .btn-outline {
      background:#fff; color:var(--primary); border:1px solid var(--primary);
    }
    .btn-outline:hover { background:var(--primary-light); }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
    .msg {
      padding:10px 14px; border-radius:8px; font-size:13px;
      margin-bottom:16px; display:none; line-height:1.5;
    }
    .msg.error {
      background:#fef2f2; color:var(--error);
      border:1px solid #fecaca; display:block;
    }
    .msg.success {
      background:#f0fdf4; color:var(--success);
      border:1px solid #bbf7d0; display:block;
    }
    .msg.warning {
      background:#fffbeb; color:#92400e;
      border:1px solid #fde68a; display:block;
    }
    .links { text-align:center; margin-top:20px; font-size:13px; }
    .links a { color:var(--primary); text-decoration:none; }
    .links a:hover { text-decoration:underline; }
    .links span { margin:0 8px; color:#cbd5e1; }

    .result-state { display:none; }
    .result-state .icon { font-size:48px; text-align:center; margin-bottom:16px; }
    .result-state h3 {
      font-size:18px; font-weight:600; text-align:center;
      color:var(--text); margin-bottom:12px;
    }
    .result-info {
      background:#f8fafc; border-radius:8px; padding:14px 16px;
      margin-bottom:16px; font-size:13px; line-height:1.6; color:var(--text);
    }
    .result-info .label { color:var(--text2); font-size:12px; }
    .result-info .value { font-weight:600; margin-bottom:8px; }
    .result-msg {
      font-size:13px; color:var(--text2); line-height:1.6;
      margin-bottom:16px;
    }
    .result-note {
      font-size:12px; color:var(--text2); padding:12px;
      background:#f8fafc; border-radius:8px; line-height:1.6;
      margin-bottom:16px;
    }
    .btn-group {
      display:flex; gap:10px; margin-top:16px;
    }
    .btn-group .btn { flex:1; }
  </style>
</head>
<body>
  <div class="card">
    <!-- 表单 -->
    <div id="formState">
      <div class="brand">
        <h2><span>Demu</span>账号</h2>
        <p>一个Demu账号尽享翰德姆全部服务～</p>
      </div>

      <div id="message" class="msg"></div>

      <form id="forgotForm">
        <div class="form-group">
          <label for="method">找回方式</label>
          <select id="method" onchange="onMethodChange()">
            <option value="email">通过邮箱找回</option>
            <option value="username">通过用户名找回</option>
            <option value="phone">通过手机号找回</option>
          </select>
        </div>

        <div class="form-group">
          <label for="account" id="inputLabel">邮箱地址</label>
          <input type="text" id="account"
            placeholder="请输入你的注册邮箱" required autofocus />
        </div>

        <div class="hint" id="hintText">
          我们将向该邮箱发送密码重置链接。
        </div>

        <!-- 确认提交按钮 -->
        <div id="confirmArea" style="display:none; margin-top:16px;">
          <div style="background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; padding:12px 14px; margin-bottom:12px;">
            <p style="font-size:13px; color:#1d4ed8; margin-bottom:6px;">
              请确认以下信息：
            </p>
            <p style="font-size:14px; font-weight:600; color:var(--text);" id="confirmText"></p>
          </div>
          <div class="btn-group">
            <button type="button" class="btn btn-outline" onclick="cancelConfirm()">修改</button>
            <button type="button" class="btn btn-primary" id="confirmBtn" onclick="doSubmit()">确认发送</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn"
          style="margin-top:16px;">
          发送重置链接
        </button>
      </form>

      <div class="links">
        <a href="/login.html">返回登录</a>
        <span>|</span>
        <a href="/register.html">注册账号</a>
      </div>
    </div>

    <!-- 结果页 -->
    <div id="resultState" class="result-state">
      <div class="brand">
        <h2><span>Demu</span>账号</h2>
        <p>一个Demu账号尽享翰德姆全部服务～</p>
      </div>

      <div class="icon" id="resultIcon"></div>
      <h3 id="resultTitle"></h3>

      <div class="result-info" id="resultInfo"></div>
      <div class="result-msg" id="resultMsg"></div>
      <div class="result-note" id="resultNote"></div>

      <div class="btn-group">
        <button class="btn btn-outline" onclick="goBack()">修改信息重试</button>
        <a href="/login.html" class="btn btn-primary"
          style="text-align:center; text-decoration:none; line-height:44px;">
          返回登录
        </a>
      </div>
    </div>
  </div>

  <script>
    var form = document.getElementById('forgotForm');
    var msg = document.getElementById('message');
    var submitBtn = document.getElementById('submitBtn');
    var confirmArea = document.getElementById('confirmArea');
    var submitCount = 0;
    var MAX_SUBMIT = 5;

    function showMsg(text, type) {
      msg.innerHTML = text;
      msg.className = 'msg ' + (type || 'error');
    }

    function hideMsg() {
      msg.className = 'msg';
      msg.innerHTML = '';
    }

    function onMethodChange() {
      var method = document.getElementById('method').value;
      var label = document.getElementById('inputLabel');
      var input = document.getElementById('account');
      var hint = document.getElementById('hintText');

      cancelConfirm();
      hideMsg();

      if (method === 'email') {
        label.textContent = '邮箱地址';
        input.placeholder = '请输入你的注册邮箱';
        input.type = 'email';
        hint.textContent = '我们将向该邮箱发送密码重置链接。';
      } else if (method === 'username') {
        label.textContent = '用户名';
        input.placeholder = '请输入你的用户名';
        input.type = 'text';
        hint.textContent = '如果该用户名存在且绑定了邮箱，重置链接将发送到对应邮箱。';
      } else if (method === 'phone') {
        label.textContent = '手机号';
        input.placeholder = '请输入你的注册手机号';
        input.type = 'tel';
        hint.textContent = '手机号找回目前仅支持发送重置链接到绑定邮箱（短信验证码开发中）。';
      }
      input.value = '';
    }

    function cancelConfirm() {
      confirmArea.style.display = 'none';
      submitBtn.style.display = 'block';
      document.getElementById('account').disabled = false;
      document.getElementById('method').disabled = false;
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      hideMsg();

      if (submitCount >= MAX_SUBMIT) {
        showMsg('操作过于频繁，请稍后再试', 'warning');
        return;
      }

      var method = document.getElementById('method').value;
      var account = document.getElementById('account').value.trim();

      if (!account) {
        var fieldName = method === 'email' ? '邮箱'
          : method === 'username' ? '用户名' : '手机号';
        showMsg('请输入' + fieldName, 'error');
        return;
      }

      var methodText = method === 'email' ? '邮箱'
        : method === 'username' ? '用户名' : '手机号';
      document.getElementById('confirmText').textContent =
        methodText + '：' + account;

      confirmArea.style.display = 'block';
      submitBtn.style.display = 'none';
      document.getElementById('account').disabled = true;
      document.getElementById('method').disabled = true;
    });

    async function doSubmit() {
      hideMsg();

      if (submitCount >= MAX_SUBMIT) {
        showMsg('操作过于频繁，请稍后再试', 'warning');
        return;
      }

      var method = document.getElementById('method').value;
      var account = document.getElementById('account').value.trim();
      var confirmBtn = document.getElementById('confirmBtn');

      confirmBtn.disabled = true;
      confirmBtn.textContent = '提交中...';
      submitCount++;

      try {
        var res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ method: method, account: account })
        });
        var data = await res.json();

        showResult(method, account, data);

      } catch (err) {
        showMsg('网络错误，请稍后重试', 'error');
        cancelConfirm();
      } finally {
        confirmBtn.disabled = false;
        confirmBtn.textContent = '确认发送';
      }
    }

    function showResult(method, account, data) {
      document.getElementById('formState').style.display = 'none';
      document.getElementById('resultState').style.display = 'block';

      var icon = document.getElementById('resultIcon');
      var title = document.getElementById('resultTitle');
      var info = document.getElementById('resultInfo');
      var resultMsg = document.getElementById('resultMsg');
      var note = document.getElementById('resultNote');

      var methodText = method === 'email' ? '邮箱'
        : method === 'username' ? '用户名' : '手机号';

      info.innerHTML =
        '<div class="label">找回方式</div>' +
        '<div class="value">' + methodText + '</div>' +
        '<div class="label">提交的信息</div>' +
        '<div class="value">' + escHtml(account) + '</div>';

      if (data.maskedEmail) {
        info.innerHTML += '<div class="label">发送到</div>' +
          '<div class="value">' + data.maskedEmail + '</div>';
      }

      if (data.success && data.found) {
        icon.textContent = '📧';
        title.textContent = '重置链接已发送';
        title.style.color = 'var(--text)';
        resultMsg.textContent = data.message;
        note.innerHTML =
          '请在 30 分钟内完成操作。没收到邮件？请检查垃圾邮件文件夹。<br>' +
          '如果确认信息正确但仍未收到，请联系我们进一步处理。';
      } else if (data.success && !data.found) {
        icon.textContent = '📨';
        title.textContent = '请求已提交';
        title.style.color = 'var(--text)';
        resultMsg.textContent = data.message;
        note.innerHTML =
          '如果存在对应的账户，重置链接将发送到绑定的邮箱。<br>' +
          '如果没有收到任何邮件，说明该账户不存在或未绑定邮箱。<br>' +
          '如果确定信息正确，请联系我们进一步处理。';
      } else {
        icon.textContent = '⚠️';
        title.textContent = '提交失败';
        title.style.color = 'var(--error)';
        resultMsg.textContent = data.message;
        note.innerHTML = '请检查输入信息后重试，或联系我们进一步处理。';
      }
    }

    function goBack() {
      document.getElementById('formState').style.display = 'block';
      document.getElementById('resultState').style.display = 'none';
      cancelConfirm();
      document.getElementById('account').value = '';
      hideMsg();

      if (submitCount >= MAX_SUBMIT) {
        showMsg('你已提交 ' + MAX_SUBMIT + ' 次，请稍后再试或联系我们处理。', 'warning');
      }
    }

    function escHtml(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
</body>
</html>

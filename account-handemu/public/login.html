<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - Demu账号</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --primary:#2563eb; --primary-hover:#1d4ed8; --primary-light:#dbeafe;
      --bg:#f1f5f9; --card:#ffffff; --text:#1e293b; --text2:#64748b;
      --border:#e2e8f0; --error:#ef4444; --success:#22c55e; --warning:#f59e0b;
    }
    body {
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
      background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .card {
      background:var(--card); border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,0.06);
      width:100%; max-width:420px; padding:40px 36px;
    }
    .brand { text-align:center; margin-bottom:28px; }
    .brand h2 { font-size:22px; font-weight:700; color:var(--text); }
    .brand h2 span { color:var(--primary); }
    .brand p { font-size:13px; color:var(--text2); margin-top:6px; }
    .form-group { margin-bottom:18px; }
    .form-group label {
      display:block; font-size:13px; font-weight:500;
      margin-bottom:6px; color:var(--text);
    }
    .form-group input {
      width:100%; height:42px; padding:0 14px; border:1px solid var(--border);
      border-radius:8px; font-size:14px; outline:none; transition:all 0.2s;
    }
    .form-group input:focus {
      border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-light);
    }
    .forgot-row {
      display:flex; justify-content:flex-end; margin-top:6px;
    }
    .forgot-row a {
      font-size:12px; color:var(--primary); text-decoration:none;
    }
    .forgot-row a:hover { text-decoration:underline; }
    .btn {
      width:100%; height:44px; border:none; border-radius:8px; font-size:14px;
      font-weight:600; cursor:pointer; transition:all 0.2s; margin-top:8px;
    }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-primary:hover { background:var(--primary-hover); }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
    .msg {
      padding:10px 14px; border-radius:8px; font-size:13px;
      margin-bottom:16px; display:none; line-height:1.5;
    }
    .msg.error {
      background:#fef2f2; color:var(--error);
      border:1px solid #fecaca; display:block;
    }
    .msg.warning {
      background:#fffbeb; color:#92400e;
      border:1px solid #fde68a; display:block;
    }
    .msg.success {
      background:#f0fdf4; color:var(--success);
      border:1px solid #bbf7d0; display:block;
    }
    .msg a { color:var(--primary); text-decoration:underline; }
    .register-link {
      text-align:center; margin-top:24px; font-size:13px; color:var(--text2);
    }
    .register-link a {
      color:var(--primary); text-decoration:none; font-weight:500;
    }
    .register-link a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h2><span>Demu</span>账号</h2>
      <p>一个Demu账号尽享翰德姆全部服务～</p>
    </div>

    <div id="message" class="msg"></div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="account">用户名 / 邮箱 / 手机号</label>
        <input type="text" id="account"
          placeholder="请输入用户名、邮箱或手机号" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password"
          placeholder="请输入密码" required />
        <div class="forgot-row">
          <a href="/forgot-password.html">忘记密码？</a>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">登 录</button>
    </form>

    <div class="register-link">
      没有账号？<a href="/register.html">去注册</a>
    </div>
  </div>

  <script>
    var form = document.getElementById('loginForm');
    var msg = document.getElementById('message');
    var submitBtn = document.getElementById('submitBtn');
    var failCount = 0;

    function showMsg(text, type) {
      msg.innerHTML = text;
      msg.className = 'msg ' + (type || 'error');
    }

    function hideMsg() {
      msg.className = 'msg';
      msg.innerHTML = '';
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      hideMsg();

      var account = document.getElementById('account').value.trim();
      var password = document.getElementById('password').value;

      if (!account || !password) {
        showMsg('请填写完整', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '登录中...';

      try {
        var res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ account: account, password: password })
        });
        var data = await res.json();

        if (data.success) {
          failCount = 0;
          showMsg('登录成功，正在跳转...', 'success');
          setTimeout(function() {
            window.location.href = '/dashboard.html';
          }, 500);
        } else {
          failCount++;
          var extra = '';

          if (failCount >= 2) {
            var remaining = 5 - failCount;
            if (remaining > 0) {
              extra = '<br>⚠️ 你已连续输错 ' + failCount + ' 次，还有 '
                + remaining + ' 次机会将锁定 IP（10 分钟）。'
                + '<br>如果忘记密码，请 <a href="/forgot-password.html">点击找回密码</a>。';
            } else {
              extra = '<br>⚠️ IP 可能已被锁定，请等待 10 分钟后重试，'
                + '或 <a href="/forgot-password.html">找回密码</a>。';
            }
          }

          showMsg(data.message + extra, failCount >= 2 ? 'warning' : 'error');
        }
      } catch (err) {
        showMsg('网络错误，请稍后重试', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>

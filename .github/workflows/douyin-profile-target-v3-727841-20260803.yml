name: Douyin proven direct profile target 727841
on:
  pull_request:
    paths:
      - '.github/douyin-profile-target-v3-727841-bootstrap'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore and repair proven enumerator
        run: |
          set -euo pipefail
          git show origin/temp/douyin-final-v4-19870927XU-20260803:tools/douyin_profile_enumerate.py > tools/douyin_profile_enumerate.py
          git show origin/temp/douyin-final-v4-19870927XU-20260803:tools/douyin_profile_direct.py > tools/douyin_profile_direct.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/douyin_profile_enumerate.py')
          s=p.read_text()
          s=s.replace('if not stage_tokens && len(tokens) >= 2:', 'if not stage_tokens and len(tokens) >= 2:')
          s=s.replace('f"https://www.douyin.com/search/{quote(TARGET_ID)?}type=user"', 'f"https://www.douyin.com/search/{quote(TARGET_ID)}?type=user"')
          p.write_text(s)
          PY
          python -m py_compile tools/douyin_profile_enumerate.py tools/douyin_profile_direct.py tools/douyin_select_exact_hq_727841.py
      - name: Publish ephemeral key and run ID
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p .douyin_profile_target_v3_exchange "$RUNNER_TEMP/douyin_profile_target_v3"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/douyin_profile_target_v3/private.pem"
          openssl pkey -in "$RUNNER_TEMP/douyin_profile_target_v3/private.pem" -pubout -out .douyin_profile_target_v3_exchange/public_key.pem
          printf '%s\n' "$GITHUB_RUN_ID" > .douyin_profile_target_v3_exchange/run_id.txt
          git rm -f .github/douyin-profile-target-v3-727841-bootstrap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .douyin_profile_target_v3_exchange
          git commit -m 'Publish repaired-profile exchange key and run ID'
          git push origin "HEAD:${HEAD_REF}"
      - name: Wait for encrypted authorized request
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            git fetch origin "$HEAD_REF" --quiet
            if git show "origin/${HEAD_REF}:.douyin_profile_target_v3_exchange/payload.json" > "$RUNNER_TEMP/douyin_profile_target_v3/payload.json" 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --disable-pip-version-check requests cryptography playwright
          python -m playwright install --with-deps chromium
      - name: Decrypt authorized request
        run: |
          mkdir -p .private
          python - <<'PY'
          import base64,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root=Path(os.environ['RUNNER_TEMP'])/'douyin_profile_target_v3'
          obj=json.loads((root/'payload.json').read_text())
          key=serialization.load_pem_private_key((root/'private.pem').read_bytes(),password=None)
          aes=key.decrypt(base64.b64decode(obj['wrapped_key']),padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          plain=AESGCM(aes).decrypt(base64.b64decode(obj['nonce']),base64.b64decode(obj['ciphertext']),b'douyin-profile-target-v3-727841')
          Path('.private/douyin_login_curl.txt').write_bytes(plain)
          PY
      - name: Enumerate direct profile with repaired proven script
        run: python tools/douyin_profile_direct.py
      - name: Select and verify exact highest-quality stream
        run: python tools/douyin_select_exact_hq_727841.py
      - name: Remove plaintext credentials
        if: always()
        run: rm -rf .private "$RUNNER_TEMP/douyin_profile_target_v3"
      - name: Upload verified MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-profile-target-v3-727841-video
          path: output/7278410935755148604.mp4
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-profile-target-v3-727841-report
          path: report/
          retention-days: 3
          if-no-files-found: warn

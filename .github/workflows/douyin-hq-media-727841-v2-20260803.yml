name: Douyin HQ media capture 727841 v2
on:
  pull_request:
    paths:
      - '.github/douyin-hq-media-727841-v2-bootstrap'
permissions:
  contents: write
concurrency:
  group: douyin-hq-media-727841-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Publish ephemeral key and run ID
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p .douyin_media_v2_exchange "$RUNNER_TEMP/douyin_media_v2"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/douyin_media_v2/private.pem"
          openssl pkey -in "$RUNNER_TEMP/douyin_media_v2/private.pem" -pubout -out .douyin_media_v2_exchange/public_key.pem
          printf '%s\n' "$GITHUB_RUN_ID" > .douyin_media_v2_exchange/run_id.txt
          git rm -f .github/douyin-hq-media-727841-v2-bootstrap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .douyin_media_v2_exchange
          git commit -m 'Publish HQ media v2 exchange key and run ID'
          git push origin "HEAD:${HEAD_REF}"
      - name: Wait for encrypted payload
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            git fetch origin "$HEAD_REF" --quiet
            if git show "origin/${HEAD_REF}:.douyin_media_v2_exchange/payload.json" > "$RUNNER_TEMP/douyin_media_v2/payload.json" 2>/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --disable-pip-version-check requests cryptography playwright
          python -m playwright install --with-deps chromium
      - name: Decrypt authorized cookies
        run: |
          mkdir -p .private
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root = Path(os.environ['RUNNER_TEMP']) / 'douyin_media_v2'
          obj = json.loads((root / 'payload.json').read_text())
          private_key = serialization.load_pem_private_key((root / 'private.pem').read_bytes(), password=None)
          aes_key = private_key.decrypt(
              base64.b64decode(obj['wrapped_key']),
              padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()), algorithm=hashes.SHA256(), label=None),
          )
          plaintext = AESGCM(aes_key).decrypt(
              base64.b64decode(obj['nonce']),
              base64.b64decode(obj['ciphertext']),
              b'douyin-hq-media-727841-v2',
          )
          Path('.private/cookie.txt').write_bytes(plaintext)
          PY
      - name: Capture, verify and mux highest-resolution tracks
        id: capture
        continue-on-error: true
        run: |
          cat > /tmp/capture_hq.py <<'PY'
          import hashlib, json, subprocess, sys, time, urllib.parse
          from pathlib import Path
          import requests
          from playwright.sync_api import sync_playwright

          AID = '7278410935755148604'
          VID = 'v0d00fg10000ck11oqjc77ubr18ss6gg'
          TARGET_DURATION = 7.15
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36'
          cookie = Path('.private/cookie.txt').read_text().strip()
          output_dir = Path('hq_output')
          report_dir = Path('hq_report')
          output_dir.mkdir(exist_ok=True)
          report_dir.mkdir(exist_ok=True)

          def parse_cookies(raw):
              result = []
              for part in raw.split(';'):
                  if '=' not in part:
                      continue
                  name, value = part.strip().split('=', 1)
                  if name and all(ch not in name for ch in ' \t\r\n'):
                      result.append({'name': name, 'value': value, 'domain': '.douyin.com', 'path': '/', 'secure': True})
              return result

          def ffprobe(path):
              proc = subprocess.run([
                  'ffprobe', '-v', 'error',
                  '-show_entries', 'stream=index,codec_type,codec_name,width,height,bit_rate,duration',
                  '-show_entries', 'format=duration,size,bit_rate,format_name',
                  '-of', 'json', str(path),
              ], capture_output=True, text=True, timeout=90)
              if proc.returncode:
                  return None
              data = json.loads(proc.stdout)
              fmt = data.get('format') or {}
              data['duration'] = float(fmt.get('duration') or 0)
              data['size'] = int(fmt.get('size') or path.stat().st_size)
              return data

          def relevant(url):
              low = url.lower()
              return any(token in low for token in (
                  'media-video', 'media-audio', 'mime_type=video', 'mime_type=audio',
                  '/video/tos/', '/obj/tos-cn-', 'bytevc', 'video_id=', 'videocut'
              ))

          urls = []
          for host in ('www.douyin.com', 'aweme.snssdk.com', 'api.amemv.com', 'www.iesdouyin.com'):
              for ratio in ('origin', '1080p', '1080', '2k', '4k'):
                  urls.append(f'https://{host}/aweme/v1/play/?video_id={VID}&ratio={ratio}&line=0&is_play_url=1')

          captured = []
          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=[
                  '--disable-blink-features=AutomationControlled',
                  '--autoplay-policy=no-user-gesture-required',
                  '--disable-features=IsolateOrigins,site-per-process',
              ])
              context = browser.new_context(
                  user_agent=UA, locale='zh-CN', viewport={'width': 1440, 'height': 2560}, device_scale_factor=2
              )
              context.add_cookies(parse_cookies(cookie))
              page = context.new_page()
              page.on('request', lambda request: captured.append(request.url) if relevant(request.url) else None)
              page.on('response', lambda response: captured.append(response.url) if relevant(response.url) else None)
              for page_url in (
                  f'https://www.douyin.com/video/{AID}',
                  f'https://www.douyin.com/jingxuan?modal_id={AID}',
              ):
                  try:
                      page.goto(page_url, wait_until='domcontentloaded', timeout=90000)
                      page.wait_for_timeout(7000)
                      page.evaluate("""() => {
                        document.querySelectorAll('video').forEach(v => {
                          v.muted = false;
                          v.volume = 0.01;
                          v.play().catch(() => {});
                        });
                      }""")
                      page.mouse.wheel(0, 800)
                      page.wait_for_timeout(12000)
                      captured.extend(page.evaluate("() => performance.getEntriesByType('resource').map(x => x.name)"))
                      captured.extend(page.evaluate("() => [...document.querySelectorAll('video')].flatMap(v => [v.src, v.currentSrc]).filter(Boolean)"))
                  except Exception:
                      pass
              browser.close()

          urls.extend(captured)
          unique = []
          seen = set()
          for url in urls:
              if isinstance(url, str) and url.startswith('http') and url not in seen:
                  seen.add(url)
                  unique.append(url)

          session = requests.Session()
          headers = {
              'User-Agent': UA,
              'Referer': f'https://www.douyin.com/video/{AID}',
              'Origin': 'https://www.douyin.com',
              'Cookie': cookie,
              'Accept': '*/*',
          }
          candidates = []
          errors = []
          for index, url in enumerate(unique):
              path = Path('/tmp') / f'hq_candidate_{index:04d}.bin'
              try:
                  with session.get(url, headers=headers, stream=True, timeout=(20, 150), allow_redirects=True) as response:
                      response.raise_for_status()
                      with path.open('wb') as target:
                          for chunk in response.iter_content(1024 * 1024):
                              if chunk:
                                  target.write(chunk)
                  if path.stat().st_size < 1000:
                      raise RuntimeError('too small')
                  probe = ffprobe(path)
                  if not probe:
                      raise RuntimeError('ffprobe failed')
                  candidates.append({'path': str(path), 'probe': probe, 'host': urllib.parse.urlsplit(url).netloc})
              except Exception as exc:
                  errors.append({'host': urllib.parse.urlsplit(url).netloc, 'error': type(exc).__name__ + ': ' + str(exc)[:200]})

          video_only, audio_only, combined = [], [], []
          for item in candidates:
              streams = item['probe'].get('streams') or []
              video_streams = [stream for stream in streams if stream.get('codec_type') == 'video']
              audio_streams = [stream for stream in streams if stream.get('codec_type') == 'audio']
              duration = item['probe']['duration']
              if duration and abs(duration - TARGET_DURATION) > 2.0:
                  continue
              if video_streams:
                  video = video_streams[0]
                  item['width'] = int(video.get('width') or 0)
                  item['height'] = int(video.get('height') or 0)
                  if item['width'] * item['height'] > 720 * 1280:
                      (combined if audio_streams else video_only).append(item)
              elif audio_streams:
                  audio_only.append(item)

          final = output_dir / f'{AID}.mp4'
          mode = None
          if combined:
              selected = max(combined, key=lambda x: (x['width'] * x['height'], x['probe']['size']))
              Path(selected['path']).replace(final)
              mode = 'combined'
          elif video_only:
              selected_video = max(video_only, key=lambda x: (x['width'] * x['height'], x['probe']['size']))
              if audio_only:
                  selected_audio = min(audio_only, key=lambda x: abs(x['probe']['duration'] - selected_video['probe']['duration']))
                  mux = subprocess.run([
                      'ffmpeg', '-y', '-i', selected_video['path'], '-i', selected_audio['path'],
                      '-map', '0:v:0', '-map', '1:a:0', '-c', 'copy', '-movflags', '+faststart', str(final),
                  ], capture_output=True, text=True, timeout=180)
                  if mux.returncode:
                      raise RuntimeError(mux.stderr[-1500:])
                  mode = 'muxed'
              else:
                  Path(selected_video['path']).replace(final)
                  mode = 'video_only'

          result = {
              'work_id': AID,
              'candidate_url_count': len(unique),
              'downloaded_candidate_count': len(candidates),
              'high_resolution_video_only': len(video_only),
              'high_resolution_combined': len(combined),
              'audio_only': len(audio_only),
              'chosen_mode': mode,
              'error_count': len(errors),
              'errors': errors[:100],
          }
          if final.exists():
              probe = ffprobe(final)
              streams = probe.get('streams') or [] if probe else []
              videos = [stream for stream in streams if stream.get('codec_type') == 'video']
              audios = [stream for stream in streams if stream.get('codec_type') == 'audio']
              width = int(videos[0].get('width') or 0) if videos else 0
              height = int(videos[0].get('height') or 0) if videos else 0
              result.update({
                  'success': bool(probe and videos and width * height > 720 * 1280),
                  'width': width,
                  'height': height,
                  'duration': probe.get('duration') if probe else 0,
                  'size': final.stat().st_size,
                  'sha256': hashlib.sha256(final.read_bytes()).hexdigest(),
                  'has_audio': bool(audios),
                  'probe': probe,
              })
          else:
              result.update({'success': False, 'error': 'no high-resolution candidate could be assembled'})

          (report_dir / '报告.json').write_text(json.dumps(result, ensure_ascii=False, indent=2))
          print(json.dumps({key: result.get(key) for key in ('success', 'width', 'height', 'duration', 'size', 'has_audio', 'chosen_mode')}, ensure_ascii=False))
          if not result.get('success'):
              sys.exit(2)
          PY
          python /tmp/capture_hq.py
      - name: Remove plaintext credentials
        if: always()
        run: rm -rf .private "$RUNNER_TEMP/douyin_media_v2"
      - name: Upload captured video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-hq-media-727841-v2-video
          path: hq_output/*.mp4
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-hq-media-727841-v2-report
          path: hq_report/
          retention-days: 3
          if-no-files-found: error
      - name: Require success
        if: steps.capture.outcome != 'success'
        run: exit 1

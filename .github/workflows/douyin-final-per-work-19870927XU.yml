name: Final Douyin per-work archive 19870927XU

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/douyin-final-bootstrap-19870927XU'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Publish ephemeral public key
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          mkdir -p .douyin_final_exchange "$RUNNER_TEMP/douyin_final"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/douyin_final/private.pem"
          openssl pkey -in "$RUNNER_TEMP/douyin_final/private.pem" -pubout -out .douyin_final_exchange/public_key.pem
          git rm -f .github/douyin-final-bootstrap-19870927XU
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .douyin_final_exchange
          git commit -m "Publish final archive exchange key"
          git push origin "HEAD:${HEAD_REF}"

      - name: Wait for encrypted login payload
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            git fetch origin "$HEAD_REF" --quiet
            if git show "origin/${HEAD_REF}:.douyin_final_exchange/payload.json" > "$RUNNER_TEMP/douyin_final/payload.json" 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk libpango-1.0-0 libpangoft2-1.0-0
          python -m pip install --upgrade pip
          pip install cryptography requests playwright pyyaml weasyprint
          python -m playwright install --with-deps chromium
          rm -rf vendor/douyin-downloader
          git clone --depth 1 https://github.com/jiji262/douyin-downloader.git vendor/douyin-downloader
          pip install -r vendor/douyin-downloader/requirements.txt

      - name: Decrypt authorized login request
        run: |
          mkdir -p .private
          python - <<'PY'
          import base64,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root=Path(os.environ['RUNNER_TEMP'])/'douyin_final'
          obj=json.loads((root/'payload.json').read_text())
          key=serialization.load_pem_private_key((root/'private.pem').read_bytes(),password=None)
          aes=key.decrypt(base64.b64decode(obj['wrapped_key']),padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          plain=AESGCM(aes).decrypt(base64.b64decode(obj['nonce']),base64.b64decode(obj['ciphertext']),b'douyin-final-19870927XU')
          Path('.private/douyin_login_curl.txt').write_bytes(plain)
          PY

      - name: Refresh full profile enumeration
        run: python tools/douyin_profile_enumerate.py

      - name: Download media, comments and create PDFs
        run: python tools/douyin_final_pipeline.py

      - name: Remove plaintext credentials
        if: always()
        run: rm -rf .private "$RUNNER_TEMP/douyin_final/private.pem" "$RUNNER_TEMP/douyin_final/payload.json"

      - name: Upload manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-final-manifest-19870927XU
          path: |
            final_run/归档清单.json
            final_run/全部作品ID.txt
            douyin_profile_enum/全部作品.json
            douyin_profile_enum/枚举摘要.json
            douyin_profile_enum/诊断/
          retention-days: 3

      - name: Upload part 01
        if: hashFiles('final_run/parts/part_01/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: douyin-final-part-01
          path: final_run/parts/part_01/
          compression-level: 0
          retention-days: 3
      - name: Upload part 02
        if: hashFiles('final_run/parts/part_02/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: douyin-final-part-02
          path: final_run/parts/part_02/
          compression-level: 0
          retention-days: 3
      - name: Upload part 03
        if: hashFiles('final_run/parts/part_03/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: douyin-final-part-03
          path: final_run/parts/part_03/
          compression-level: 0
          retention-days: 3
      - name: Upload part 04
        if: hashFiles('final_run/parts/part_04/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: douyin-final-part-04
          path: final_run/parts/part_04/
          compression-level: 0
          retention-days: 3
      - name: Upload part 05
        if: hashFiles('final_run/parts/part_05/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: douyin-final-part-05
          path: final_run/parts/part_05/
          compression-level: 0
          retention-days: 3
      - name: Upload part 06
        if: hashFiles('final_run/parts/part_06/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: douyin-final-part-06
          path: final_run/parts/part_06/
          compression-level: 0
          retention-days: 3

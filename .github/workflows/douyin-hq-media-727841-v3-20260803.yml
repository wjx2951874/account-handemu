name: Douyin HQ media response capture 727841 v3
on:
  pull_request:
    paths:
      - '.github/douyin-hq-media-727841-v3-bootstrap'
permissions:
  contents: write
concurrency:
  group: douyin-hq-media-727841-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Publish exchange key and run ID
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p .douyin_media_v3_exchange "$RUNNER_TEMP/douyin_media_v3"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/douyin_media_v3/private.pem"
          openssl pkey -in "$RUNNER_TEMP/douyin_media_v3/private.pem" -pubout -out .douyin_media_v3_exchange/public_key.pem
          printf '%s\n' "$GITHUB_RUN_ID" > .douyin_media_v3_exchange/run_id.txt
          git rm -f .github/douyin-hq-media-727841-v3-bootstrap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .douyin_media_v3_exchange
          git commit -m 'Publish HQ media v3 exchange key and run ID'
          git push origin "HEAD:${HEAD_REF}"
      - name: Wait for encrypted payload
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            git fetch origin "$HEAD_REF" --quiet
            if git show "origin/${HEAD_REF}:.douyin_media_v3_exchange/payload.json" > "$RUNNER_TEMP/douyin_media_v3/payload.json" 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --disable-pip-version-check cryptography playwright
          python -m playwright install --with-deps chromium
      - name: Decrypt cookies
        run: |
          mkdir -p .private
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root=Path(os.environ['RUNNER_TEMP'])/'douyin_media_v3'
          obj=json.loads((root/'payload.json').read_text())
          key=serialization.load_pem_private_key((root/'private.pem').read_bytes(),password=None)
          aes=key.decrypt(base64.b64decode(obj['wrapped_key']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          plain=AESGCM(aes).decrypt(base64.b64decode(obj['nonce']),base64.b64decode(obj['ciphertext']),b'douyin-hq-media-727841-v3')
          Path('.private/cookie.txt').write_bytes(plain)
          PY
      - name: Capture genuine browser media responses
        id: capture
        continue-on-error: true
        run: |
          cat > /tmp/capture_v3.py <<'PY'
          import hashlib, json, re, subprocess, sys, urllib.parse
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          AID='7278410935755148604'
          TARGET=7.15
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36'
          raw_cookie=Path('.private/cookie.txt').read_text().strip()
          raw_dir=Path('captured_raw'); raw_dir.mkdir(exist_ok=True)
          out_dir=Path('hq_output'); out_dir.mkdir(exist_ok=True)
          rep_dir=Path('hq_report'); rep_dir.mkdir(exist_ok=True)

          def cookies(raw):
              result=[]
              for part in raw.split(';'):
                  if '=' not in part: continue
                  name,value=part.strip().split('=',1)
                  if name and not re.search(r'\s',name): result.append({'name':name,'value':value,'domain':'.douyin.com','path':'/','secure':True})
              return result

          def probe(path):
              p=subprocess.run(['ffprobe','-v','error','-probesize','20M','-analyzeduration','20M','-show_entries','stream=index,codec_type,codec_name,width,height,bit_rate,duration','-show_entries','format=format_name,duration,size,bit_rate','-of','json',str(path)],capture_output=True,text=True,timeout=90)
              if p.returncode: return None
              data=json.loads(p.stdout); fmt=data.get('format') or {}
              data['duration']=float(fmt.get('duration') or 0); data['size']=int(fmt.get('size') or path.stat().st_size)
              return data

          def likely_media(url, content_type=''):
              low=url.lower(); ct=content_type.lower()
              return ct.startswith('video/') or ct.startswith('audio/') or ('octet-stream' in ct and any(x in low for x in ('/video/','media-video','media-audio'))) or any(x in low for x in ('media-video','media-audio','/video/tos/','mime_type=video','mime_type=audio'))

          def reject_text(data):
              head=data[:512].lstrip()
              if head.startswith((b'<',b'{',b'[',b'function',b'!function',b'window.',b'var ',b'const ',b'let ')): return True
              if head:
                  printable=sum(1 for b in head if b in b'\t\r\n' or 32<=b<127)/len(head)
                  if printable>0.94: return True
              return False

          response_records=[]; media_urls=[]; sequence=0
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True,args=['--disable-blink-features=AutomationControlled','--autoplay-policy=no-user-gesture-required'])
              context=browser.new_context(user_agent=UA,locale='zh-CN',viewport={'width':1440,'height':2560},device_scale_factor=2,extra_http_headers={'Referer':f'https://www.douyin.com/video/{AID}'})
              context.add_cookies(cookies(raw_cookie))
              page=context.new_page()

              def handle_response(response):
                  nonlocal sequence
                  try:
                      headers=response.all_headers(); ct=headers.get('content-type','')
                      if not likely_media(response.url,ct): return
                      media_urls.append(response.url)
                      body=response.body()
                      if len(body)<1000 or reject_text(body): return
                      sequence+=1
                      path=raw_dir/f'browser_{sequence:03d}.bin'; path.write_bytes(body)
                      response_records.append({'path':str(path),'source':'browser_body','status':response.status,'content_type':ct,'content_range':headers.get('content-range'),'size':len(body),'host':urllib.parse.urlsplit(response.url).netloc})
                  except Exception: pass

              page.on('response',handle_response)
              for url in (f'https://www.douyin.com/video/{AID}',f'https://www.douyin.com/jingxuan?modal_id={AID}'):
                  try:
                      page.goto(url,wait_until='domcontentloaded',timeout=90000)
                      page.wait_for_timeout(7000)
                      page.evaluate("() => document.querySelectorAll('video').forEach(v => {v.muted=false;v.volume=.01;v.play().catch(()=>{})})")
                      page.wait_for_timeout(15000)
                      media_urls.extend(page.evaluate("() => [...document.querySelectorAll('video')].flatMap(v=>[v.src,v.currentSrc]).filter(Boolean)"))
                      entries=page.evaluate("() => performance.getEntriesByType('resource').filter(x=>['video','audio'].includes(x.initiatorType)).map(x=>x.name)")
                      media_urls.extend(entries)
                  except Exception: pass

              unique=[]; seen=set()
              for url in media_urls:
                  if isinstance(url,str) and url.startswith('http') and url not in seen:
                      seen.add(url); unique.append(url)
              for url in unique:
                  try:
                      response=context.request.get(url,headers={'Referer':f'https://www.douyin.com/video/{AID}','Accept':'*/*'},timeout=120000,fail_on_status_code=False)
                      ct=response.headers.get('content-type','')
                      data=response.body()
                      if response.status>=400 or len(data)<1000 or reject_text(data) or not likely_media(url,ct): continue
                      sequence+=1
                      path=raw_dir/f'context_{sequence:03d}.bin'; path.write_bytes(data)
                      response_records.append({'path':str(path),'source':'context_request','status':response.status,'content_type':ct,'content_range':response.headers.get('content-range'),'size':len(data),'host':urllib.parse.urlsplit(url).netloc})
                  except Exception: pass
              browser.close()

          assessed=[]
          for rec in response_records:
              path=Path(rec['path']); pr=probe(path)
              if not pr: continue
              streams=pr.get('streams') or []
              videos=[s for s in streams if s.get('codec_type')=='video']
              audios=[s for s in streams if s.get('codec_type')=='audio']
              if not videos: continue
              v=videos[0]; width=int(v.get('width') or 0); height=int(v.get('height') or 0)
              duration=pr['duration']
              if width*height<=720*1280: continue
              if duration and abs(duration-TARGET)>2.0: continue
              rec.update({'probe':pr,'width':width,'height':height,'duration':duration,'has_audio':bool(audios)})
              assessed.append(rec)

          selected=max(assessed,key=lambda x:(x['width']*x['height'],x['size'])) if assessed else None
          final=out_dir/f'{AID}_video.mp4'
          result={'work_id':AID,'observed_media_url_count':len(set(media_urls)),'captured_binary_count':len(response_records),'valid_high_resolution_count':len(assessed),'candidate_summaries':[{k:r.get(k) for k in ('source','status','content_type','content_range','size','host','width','height','duration','has_audio')} for r in assessed]}
          if selected:
              source=selected['path']
              remux=subprocess.run(['ffmpeg','-y','-i',source,'-map','0:v:0','-an','-c','copy','-movflags','+faststart',str(final)],capture_output=True,text=True,timeout=180)
              if remux.returncode==0:
                  final_probe=probe(final)
              else:
                  final_probe=None; result['remux_error']=remux.stderr[-1500:]
              if final_probe:
                  streams=final_probe.get('streams') or []; videos=[s for s in streams if s.get('codec_type')=='video']
                  width=int(videos[0].get('width') or 0) if videos else 0; height=int(videos[0].get('height') or 0) if videos else 0
                  result.update({'success':bool(videos and width*height>720*1280),'width':width,'height':height,'duration':final_probe['duration'],'size':final.stat().st_size,'sha256':hashlib.sha256(final.read_bytes()).hexdigest(),'probe':final_probe})
              else: result.update({'success':False,'error':'selected browser media could not be remuxed'})
          else: result.update({'success':False,'error':'no genuine high-resolution media response found'})
          (rep_dir/'报告.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps({k:result.get(k) for k in ('success','observed_media_url_count','captured_binary_count','valid_high_resolution_count','width','height','duration','size')},ensure_ascii=False))
          if not result.get('success'): sys.exit(2)
          PY
          python /tmp/capture_v3.py
      - name: Remove credentials
        if: always()
        run: rm -rf .private "$RUNNER_TEMP/douyin_media_v3"
      - name: Upload selected video track
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-hq-media-727841-v3-video
          path: hq_output/*.mp4
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-hq-media-727841-v3-report
          path: hq_report/
          retention-days: 3
          if-no-files-found: error
      - name: Require success
        if: steps.capture.outcome != 'success'
        run: exit 1

name: Douyin highest-quality replacement
on:
  pull_request:
    paths:
      - '.github/douyin-hq-replace-bootstrap'
permissions:
  contents: write
  actions: read
jobs:
  replace:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download verified baseline manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline_unpack baseline
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/8844562694/zip -o baseline.zip
          unzip -q baseline.zip -d baseline_unpack
          cp 'baseline_unpack/final_v2/manifest/归档清单.json' baseline/归档清单.json
          cp 'baseline_unpack/douyin_profile_enum/全部作品.json' baseline/全部作品.json
      - name: Publish ephemeral public key
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p .douyin_hq_exchange "$RUNNER_TEMP/douyin_hq"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/douyin_hq/private.pem"
          openssl pkey -in "$RUNNER_TEMP/douyin_hq/private.pem" -pubout -out .douyin_hq_exchange/public_key.pem
          printf '%s\n' '${{ github.run_id }}' > .douyin_hq_exchange/run_id.txt
          git rm -f .github/douyin-hq-replace-bootstrap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .douyin_hq_exchange
          git commit -m 'Publish HQ replacement exchange key'
          git push origin "HEAD:${HEAD_REF}"
      - name: Wait for encrypted login payload
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            git fetch origin "$HEAD_REF" --quiet
            if git show "origin/${HEAD_REF}:.douyin_hq_exchange/payload.json" > "$RUNNER_TEMP/douyin_hq/payload.json" 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Install runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install requests cryptography playwright
          python -m playwright install --with-deps chromium
      - name: Decrypt authorized login cookies
        run: |
          mkdir -p .private
          python - <<'PY'
          import base64,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root=Path(os.environ['RUNNER_TEMP'])/'douyin_hq'
          obj=json.loads((root/'payload.json').read_text())
          key=serialization.load_pem_private_key((root/'private.pem').read_bytes(),password=None)
          aes=key.decrypt(base64.b64decode(obj['wrapped_key']),padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          plain=AESGCM(aes).decrypt(base64.b64decode(obj['nonce']),base64.b64decode(obj['ciphertext']),b'douyin-hq-replace-19870927XU')
          Path('.private/cookie.txt').write_bytes(plain)
          PY
      - name: Download and verify highest-resolution replacements
        id: replace
        continue-on-error: true
        run: python tools/douyin_hq_replace_20260803.py
      - name: Remove plaintext credentials
        if: always()
        run: rm -rf .private "$RUNNER_TEMP/douyin_hq/private.pem" "$RUNNER_TEMP/douyin_hq/payload.json"
      - name: Upload replacement videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-hq-replacements-19870927XU
          path: hq_output/
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-hq-replacement-report-19870927XU
          path: hq_report/
          retention-days: 3
          compression-level: 6
          if-no-files-found: warn
      - name: Fail if replacement verification failed
        if: steps.replace.outcome != 'success'
        run: exit 1

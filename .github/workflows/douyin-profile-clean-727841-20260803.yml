name: Douyin clean exact profile recovery 727841
on:
  pull_request:
    paths:
      - '.github/douyin-profile-clean-727841-bootstrap'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Validate clean recovery scripts
        run: python -m py_compile tools/douyin_profile_target_clean_727841.py tools/douyin_select_exact_hq_727841.py
      - name: Publish ephemeral key and run ID
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p .douyin_profile_clean_exchange "$RUNNER_TEMP/douyin_profile_clean"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/douyin_profile_clean/private.pem"
          openssl pkey -in "$RUNNER_TEMP/douyin_profile_clean/private.pem" -pubout -out .douyin_profile_clean_exchange/public_key.pem
          printf '%s\n' "$GITHUB_RUN_ID" > .douyin_profile_clean_exchange/run_id.txt
          git rm -f .github/douyin-profile-clean-727841-bootstrap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .douyin_profile_clean_exchange
          git commit -m 'Publish clean profile exchange key and run ID'
          git push origin "HEAD:${HEAD_REF}"
      - name: Wait for encrypted authorized request
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            git fetch origin "$HEAD_REF" --quiet
            if git show "origin/${HEAD_REF}:.douyin_profile_clean_exchange/payload.json" > "$RUNNER_TEMP/douyin_profile_clean/payload.json" 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --disable-pip-version-check requests cryptography playwright
          python -m playwright install --with-deps chromium
      - name: Decrypt authorized login request
        run: |
          mkdir -p .private
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root = Path(os.environ['RUNNER_TEMP']) / 'douyin_profile_clean'
          obj = json.loads((root / 'payload.json').read_text())
          private_key = serialization.load_pem_private_key((root / 'private.pem').read_bytes(), password=None)
          aes_key = private_key.decrypt(
              base64.b64decode(obj['wrapped_key']),
              padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()), algorithm=hashes.SHA256(), label=None),
          )
          plaintext = AESGCM(aes_key).decrypt(
              base64.b64decode(obj['nonce']),
              base64.b64decode(obj['ciphertext']),
              b'douyin-profile-clean-727841',
          )
          Path('.private/douyin_login_curl.txt').write_bytes(plaintext)
          PY
      - name: Enumerate exact author profile until target work
        run: python tools/douyin_profile_target_clean_727841.py
      - name: Download and verify exact highest-quality target
        run: python tools/douyin_select_exact_hq_727841.py
      - name: Remove plaintext credentials
        if: always()
        run: rm -rf .private "$RUNNER_TEMP/douyin_profile_clean"
      - name: Upload verified MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-profile-clean-727841-video
          path: output/7278410935755148604.mp4
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn
      - name: Upload verification and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-profile-clean-727841-report
          path: |
            report/
            douyin_profile_enum/诊断/运行诊断.json
          retention-days: 3
          if-no-files-found: warn

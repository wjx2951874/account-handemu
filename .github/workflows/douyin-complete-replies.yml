name: Secure complete Douyin replies

on:
  push:
    branches:
      - archive/douyin-7666692683432429819-secure-20260731
    paths:
      - .github/workflows/douyin-complete-replies.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: archive/douyin-7666692683432429819-secure-20260731
  PYTHONUNBUFFERED: "1"

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive/douyin-7666692683432429819-secure-20260731
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate one-time public key
        run: |
          python -m pip install --quiet cryptography
          mkdir -p handshake
          python - <<'PY'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          rid=os.environ['GITHUB_RUN_ID']; key=rsa.generate_private_key(public_exponent=65537,key_size=3072)
          Path('/tmp/complete-private.pem').write_bytes(key.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()))
          Path(f'handshake/complete-public-{rid}.pem').write_bytes(key.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo))
          Path('handshake/complete_latest_run_id.txt').write_text(rid+'\n',encoding='utf-8')
          PY
      - name: Publish public key
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add handshake/complete_latest_run_id.txt "handshake/complete-public-${GITHUB_RUN_ID}.pem"
          git commit -m "archive: publish complete-run key ${GITHUB_RUN_ID}"
          git push origin HEAD:${TARGET_BRANCH}
      - name: Wait for encrypted login
        run: |
          set -euo pipefail
          target="handshake/complete-login-${GITHUB_RUN_ID}.enc.json"; found=0
          for i in $(seq 1 150); do
            git fetch --quiet origin "${TARGET_BRANCH}"
            if git show "origin/${TARGET_BRANCH}:${target}" >/tmp/complete-login.enc.json 2>/dev/null; then found=1; break; fi
            sleep 4
          done
          test "$found" = 1
      - name: Decrypt login in memory
        run: |
          python - <<'PY'
          import base64,gzip,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          e=json.loads(Path('/tmp/complete-login.enc.json').read_text('utf-8'))
          key=serialization.load_pem_private_key(Path('/tmp/complete-private.pem').read_bytes(),password=None)
          aes=key.decrypt(base64.b64decode(e['encrypted_key']),padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          packed=AESGCM(aes).decrypt(base64.b64decode(e['nonce']),base64.b64decode(e['ciphertext']),b'douyin-complete-replies-gzip-7666692683432429819')
          raw=gzip.decompress(packed)
          Path('/tmp/complete-login.json').write_bytes(raw); os.chmod('/tmp/complete-login.json',0o600)
          obj=json.loads(raw); assert 'sessionid=' in obj.get('cookie','')
          print('compressed encrypted login validated')
          PY
      - name: Install browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Capture replies
        env:
          LOGIN_JSON: /tmp/complete-login.json
        run: python tools/dygrab_complete_replies.py
      - name: Erase login material
        if: always()
        run: rm -f /tmp/complete-login.json /tmp/complete-login.enc.json /tmp/complete-private.pem
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: douyin-complete-replies-7666692683432429819
          path: |
            douyin-complete-replies-7666692683432429819.zip
            complete_reply_out/抓取统计.json
            complete_reply_out/01_评论标签.png
            complete_reply_out/02_抓取结束.png
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

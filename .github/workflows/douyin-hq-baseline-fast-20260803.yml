name: Douyin HQ baseline fast path
on:
  pull_request:
    paths:
      - '.github/douyin-hq-baseline-fast-bootstrap'
permissions:
  contents: write
  actions: read
jobs:
  replace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download verified baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline_unpack baseline
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/8844562694/zip -o baseline.zip
          unzip -q baseline.zip -d baseline_unpack
          cp 'baseline_unpack/douyin_profile_enum/全部作品.json' baseline/全部作品.json
      - name: Publish ephemeral public key
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p .douyin_hq_fast_exchange "$RUNNER_TEMP/douyin_hq_fast"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/douyin_hq_fast/private.pem"
          openssl pkey -in "$RUNNER_TEMP/douyin_hq_fast/private.pem" -pubout -out .douyin_hq_fast_exchange/public_key.pem
          printf '%s\n' '${{ github.run_id }}' > .douyin_hq_fast_exchange/run_id.txt
          git rm -f .github/douyin-hq-baseline-fast-bootstrap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .douyin_hq_fast_exchange
          git commit -m 'Publish HQ fast exchange key'
          git push origin "HEAD:${HEAD_REF}"
      - name: Wait for encrypted login payload
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            git fetch origin "$HEAD_REF" --quiet
            if git show "origin/${HEAD_REF}:.douyin_hq_fast_exchange/payload.json" > "$RUNNER_TEMP/douyin_hq_fast/payload.json" 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install requests cryptography
      - name: Decrypt authorized login cookies
        run: |
          mkdir -p .private
          python - <<'PY'
          import base64,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root=Path(os.environ['RUNNER_TEMP'])/'douyin_hq_fast'
          obj=json.loads((root/'payload.json').read_text())
          key=serialization.load_pem_private_key((root/'private.pem').read_bytes(),password=None)
          aes=key.decrypt(base64.b64decode(obj['wrapped_key']),padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          plain=AESGCM(aes).decrypt(base64.b64decode(obj['nonce']),base64.b64decode(obj['ciphertext']),b'douyin-hq-fast-19870927XU')
          Path('.private/cookie.txt').write_bytes(plain)
          PY
      - name: Download exact higher-resolution baseline candidates
        id: download
        continue-on-error: true
        run: |
          cat > /tmp/hq_fast.py <<'PY'
          import hashlib,json,subprocess,sys,urllib.parse
          from pathlib import Path
          import requests
          UID='141208157956367'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36'
          arr=json.loads(Path('baseline/全部作品.json').read_text())
          cookie=Path('.private/cookie.txt').read_text().strip()
          out=Path('hq_output'); report=Path('hq_report'); out.mkdir(exist_ok=True); report.mkdir(exist_ok=True)
          sess=requests.Session(); results=[]
          def probe(p):
            q=subprocess.run(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=codec_name,width,height,bit_rate','-show_entries','format=duration,size,bit_rate','-of','json',str(p)],capture_output=True,text=True,timeout=60)
            if q.returncode: return None
            o=json.loads(q.stdout); s=(o.get('streams') or [{}])[0]; f=o.get('format') or {}
            return {'codec':s.get('codec_name'),'width':int(s.get('width') or 0),'height':int(s.get('height') or 0),'duration':float(f.get('duration') or 0),'size':int(f.get('size') or p.stat().st_size),'bit_rate':int(f.get('bit_rate') or 0)}
          targets=[]
          for a in arr:
            if str((a.get('author') or {}).get('uid'))!=UID: continue
            best=a.get('best_video') or {}; oldw=int(best.get('width') or 0); oldh=int(best.get('height') or 0); oldarea=oldw*oldh
            cs=a.get('video_candidates') or []; maxarea=max((int(c.get('width') or 0)*int(c.get('height') or 0) for c in cs),default=0)
            if maxarea>oldarea: targets.append((str(a.get('aweme_id')),oldw,oldh,cs))
          for idx,(aid,oldw,oldh,cs) in enumerate(targets,1):
            rec={'id':aid,'old_width':oldw,'old_height':oldh}; errors=[]; chosen=None
            cs=sorted(cs,key=lambda c:(int(c.get('width') or 0)*int(c.get('height') or 0),int(c.get('bit_rate') or 0),int(c.get('data_size') or 0)),reverse=True)
            maxclaim=max(int(c.get('width') or 0)*int(c.get('height') or 0) for c in cs)
            for ci,c in enumerate(cs):
              if int(c.get('width') or 0)*int(c.get('height') or 0)<=oldw*oldh: break
              for ui,url in enumerate(c.get('urls') or []):
                if not isinstance(url,str) or not url.startswith('http'): continue
                p=Path('/tmp')/f'{aid}_{ci}_{ui}.mp4'
                try:
                  headers={'User-Agent':UA,'Referer':'https://www.douyin.com/','Origin':'https://www.douyin.com','Cookie':cookie,'Accept':'*/*'}
                  with sess.get(url,headers=headers,stream=True,timeout=(15,90),allow_redirects=True) as r:
                    r.raise_for_status()
                    with p.open('wb') as fh:
                      for chunk in r.iter_content(1024*1024):
                        if chunk: fh.write(chunk)
                  pr=probe(p)
                  if not pr or pr['width']*pr['height']<=oldw*oldh: raise RuntimeError(f'actual not higher: {pr}')
                  if chosen is None or (pr['width']*pr['height'],pr['bit_rate'],pr['size'])>(chosen['probe']['width']*chosen['probe']['height'],chosen['probe']['bit_rate'],chosen['probe']['size']):
                    chosen={'path':p,'probe':pr,'source':c.get('source'),'gear':c.get('gear_name')}
                  if pr['width']*pr['height']>=maxclaim: break
                except Exception as e:
                  errors.append({'candidate':ci,'url':ui,'host':urllib.parse.urlsplit(url).netloc,'error':type(e).__name__+': '+str(e)[:300]})
                  if p.exists(): p.unlink()
              if chosen and chosen['probe']['width']*chosen['probe']['height']>=maxclaim: break
            if chosen:
              final=out/f'{aid}.mp4'; final.write_bytes(chosen['path'].read_bytes())
              rec.update(status='success',new_width=chosen['probe']['width'],new_height=chosen['probe']['height'],codec=chosen['probe']['codec'],duration=chosen['probe']['duration'],size=final.stat().st_size,sha256=hashlib.sha256(final.read_bytes()).hexdigest(),source=chosen['source'],gear_name=chosen['gear'],errors=errors)
              print(f'[{idx}/{len(targets)}] {aid}: {oldw}x{oldh} -> {rec["new_width"]}x{rec["new_height"]}',flush=True)
            else: rec.update(status='failed',errors=errors)
            results.append(rec)
          summary={'target_count':len(targets),'success_count':sum(r['status']=='success' for r in results),'failed_count':sum(r['status']!='success' for r in results),'results':results}
          (report/'替换报告.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          print(json.dumps({k:summary[k] for k in ('target_count','success_count','failed_count')},ensure_ascii=False))
          if summary['failed_count']: sys.exit(2)
          PY
          python /tmp/hq_fast.py
      - name: Remove plaintext credentials
        if: always()
        run: rm -rf .private "$RUNNER_TEMP/douyin_hq_fast/private.pem" "$RUNNER_TEMP/douyin_hq_fast/payload.json"
      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-hq-fast-videos-19870927XU
          path: hq_output/*.mp4
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-hq-fast-report-19870927XU
          path: hq_report/
          retention-days: 3
          if-no-files-found: error
      - name: Require complete set
        if: steps.download.outcome != 'success'
        run: exit 1

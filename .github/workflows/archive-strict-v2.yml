name: Strict full reply archive collector

on:
  push:
    branches: [archive/douyin-7666692683432429819]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive/douyin-7666692683432429819
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Load strict collector and dependencies
        run: |
          git fetch origin archive/douyin-7666692683432429819-hybrid
          git show FETCH_HEAD:tools/archive_douyin_hybrid_v2.py > tools/archive_douyin_hybrid_v2.py
          mkdir -p vendor
          git clone --filter=blob:none --no-checkout https://github.com/jiji262/douyin-downloader.git vendor/douyin-downloader
          cd vendor/douyin-downloader
          git checkout 1d23957796cafe934890a165a389bb22157e5630
          cd ../..
          python -m pip install --upgrade pip
          python -m pip install -r vendor/douyin-downloader/requirements.txt requests
      - name: Run strict collector
        run: |
          mkdir -p hybrid_output/诊断
          set +e
          python tools/archive_douyin_hybrid_v2.py 2>&1 | tee hybrid_output/诊断/collector.log
          echo "${PIPESTATUS[0]}" > hybrid_output/诊断/collector.exitcode
          exit 0
      - name: Ensure result archive
        run: |
          if compgen -G 'hybrid_artifact/*.zip' > /dev/null; then exit 0; fi
          mkdir -p hybrid_artifact
          python - <<'PY'
          from pathlib import Path
          import zipfile
          src = Path('hybrid_output')
          dst = Path('hybrid_artifact/001_严格抓取诊断资料_7666692683432429819.zip')
          with zipfile.ZipFile(dst, 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              for p in src.rglob('*'):
                  if p.is_file(): zf.write(p, p.relative_to(src.parent))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: douyin-strict-v2-archive-7666692683432429819
          path: hybrid_artifact/*.zip
          retention-days: 7
          compression-level: 0
      - name: Publish strict metadata
        run: |
          rm -rf strict_published
          mkdir -p strict_published
          A="$(find hybrid_artifact -type f -name '*.zip' | head -n1)"
          basename "$A" > strict_published/archive_name.txt
          sha256sum "$A" | awk '{print $1}' > strict_published/archive_sha256.txt
          stat -c '%s' "$A" > strict_published/archive_size.txt
          echo "$GITHUB_RUN_ID" > strict_published/run_id.txt
          echo 'douyin-strict-v2-archive-7666692683432429819' > strict_published/artifact_name.txt
          cp hybrid_output/诊断/collector.log strict_published/collector.log 2>/dev/null || true
          cp hybrid_output/诊断/collector.exitcode strict_published/collector.exitcode 2>/dev/null || true
          cp hybrid_output/000_存档说明.txt strict_published/archive_summary.txt 2>/dev/null || true
          cp hybrid_output/作者图片评论清单.json strict_published/author_image_comments.json 2>/dev/null || true
          cp hybrid_output/下载结果.json strict_published/download_results.json 2>/dev/null || true
          cp hybrid_output/诊断/评论分页诊断.json strict_published/api_diagnostics.json 2>/dev/null || true
          split -b 45M -d -a 3 "$A" strict_published/archive.part.
          find strict_published -maxdepth 1 -type f -printf '%f\n' | sort > strict_published/files.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f strict_published
          git commit -m 'archive: publish strict v2 result' || exit 0
          git push origin HEAD:archive/douyin-7666692683432429819

name: Douyin final archive v4 19870927XU

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/douyin-final-v4-bootstrap-19870927XU'

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Publish ephemeral public key
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          mkdir -p .douyin_final_v4_exchange "$RUNNER_TEMP/douyin_final_v4"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/douyin_final_v4/private.pem"
          openssl pkey -in "$RUNNER_TEMP/douyin_final_v4/private.pem" -pubout -out .douyin_final_v4_exchange/public_key.pem
          printf '%s\n' '${{ github.run_id }}' > .douyin_final_v4_exchange/run_id.txt
          git rm -f .github/douyin-final-v4-bootstrap-19870927XU
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .douyin_final_v4_exchange
          git commit -m "Publish v4 archive exchange key"
          git push origin "HEAD:${HEAD_REF}"

      - name: Wait for encrypted login payload
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            git fetch origin "$HEAD_REF" --quiet
            if git show "origin/${HEAD_REF}:.douyin_final_v4_exchange/payload.json" > "$RUNNER_TEMP/douyin_final_v4/payload.json" 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and assemble archive script
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk libpango-1.0-0 libpangoft2-1.0-0
          python -m pip install --upgrade pip
          pip install cryptography requests aiohttp pillow weasyprint playwright
          python -m playwright install --with-deps chromium
          rm -rf vendor/douyin-downloader
          git clone --depth 1 https://github.com/jiji262/douyin-downloader.git vendor/douyin-downloader
          pip install -r vendor/douyin-downloader/requirements.txt
          cat tools/v2chunks/chunk_* | tr -d '\n\r' | base64 -d > tools/douyin_full_archive_v2.py
          python -m py_compile tools/douyin_full_archive_v2.py tools/douyin_profile_direct.py

      - name: Decrypt authorized login request
        run: |
          mkdir -p .private
          python - <<'PY'
          import base64,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root=Path(os.environ['RUNNER_TEMP'])/'douyin_final_v4'
          obj=json.loads((root/'payload.json').read_text())
          key=serialization.load_pem_private_key((root/'private.pem').read_bytes(),password=None)
          aes=key.decrypt(base64.b64decode(obj['wrapped_key']),padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          plain=AESGCM(aes).decrypt(base64.b64decode(obj['nonce']),base64.b64decode(obj['ciphertext']),b'douyin-final-v4-19870927XU')
          Path('.private/douyin_login_curl.txt').write_bytes(plain)
          PY

      - name: Refresh complete profile list or use verified 117-work baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_ARTIFACT_ID: '8835845060'
        run: |
          set -euo pipefail
          fresh=0
          if python tools/douyin_profile_direct.py; then
            if python -c "import json; d=json.load(open('douyin_profile_enum/全部作品.json')); assert len(d)>=117, len(d); print({'fresh_work_count':len(d)})"; then fresh=1; fi
          fi
          if [ "$fresh" != 1 ]; then
            echo 'Fresh enumeration blocked or incomplete; loading verified full baseline.'
            rm -rf douyin_profile_enum baseline-artifact baseline.zip
            curl --fail --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASELINE_ARTIFACT_ID}/zip" --output baseline.zip
            mkdir -p baseline-artifact douyin_profile_enum/诊断
            unzip -q baseline.zip -d baseline-artifact
            WORKS="$(find baseline-artifact -type f -name '全部作品.json' | head -1)"
            SUMMARY="$(find baseline-artifact -type f -name '枚举摘要.json' | head -1)"
            test -n "$WORKS" -a -f "$WORKS"
            cp "$WORKS" douyin_profile_enum/全部作品.json
            if [ -n "$SUMMARY" ] && [ -f "$SUMMARY" ]; then cp "$SUMMARY" douyin_profile_enum/枚举摘要.json; fi
            python -c "import json; from pathlib import Path; p=Path('douyin_profile_enum/全部作品.json'); d=json.loads(p.read_text()); assert len(d)>=117, len(d); Path('douyin_profile_enum/诊断').mkdir(parents=True,exist_ok=True); Path('douyin_profile_enum/诊断/回退说明.txt').write_text('实时主页枚举受页面限制，使用2026年8月2日成功全量枚举的117个作品元数据作为归档基线；媒体和评论仍使用本次有效登录态重新抓取。\\n'); print({'fallback_work_count':len(d)})"
          fi

      - name: Download original media, paginate every comment and reply, render PDFs
        run: python tools/douyin_full_archive_v2.py

      - name: Remove plaintext credentials
        if: always()
        run: rm -rf .private "$RUNNER_TEMP/douyin_final_v4/private.pem" "$RUNNER_TEMP/douyin_final_v4/payload.json"

      - name: Upload manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-final-v4-manifest
          path: |
            final_v2/manifest/
            douyin_profile_enum/全部作品.json
            douyin_profile_enum/枚举摘要.json
            douyin_profile_enum/诊断/
          retention-days: 3
          if-no-files-found: warn

      - name: Upload parts 01-05
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-final-v4-parts-01-05
          path: |
            final_v2/parts/part_01/
            final_v2/parts/part_02/
            final_v2/parts/part_03/
            final_v2/parts/part_04/
            final_v2/parts/part_05/
          compression-level: 0
          retention-days: 3
          if-no-files-found: warn

      - name: Upload parts 06-10
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-final-v4-parts-06-10
          path: |
            final_v2/parts/part_06/
            final_v2/parts/part_07/
            final_v2/parts/part_08/
            final_v2/parts/part_09/
            final_v2/parts/part_10/
          compression-level: 0
          retention-days: 3
          if-no-files-found: warn

      - name: Upload parts 11-15
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-final-v4-parts-11-15
          path: |
            final_v2/parts/part_11/
            final_v2/parts/part_12/
            final_v2/parts/part_13/
            final_v2/parts/part_14/
            final_v2/parts/part_15/
          compression-level: 0
          retention-days: 3
          if-no-files-found: warn

      - name: Upload parts 16-20
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-final-v4-parts-16-20
          path: |
            final_v2/parts/part_16/
            final_v2/parts/part_17/
            final_v2/parts/part_18/
            final_v2/parts/part_19/
            final_v2/parts/part_20/
          compression-level: 0
          retention-days: 3
          if-no-files-found: warn

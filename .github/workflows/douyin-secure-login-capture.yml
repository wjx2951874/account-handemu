name: Secure logged Douyin capture

on:
  push:
    branches:
      - archive/douyin-7666692683432429819-secure-20260731
    paths:
      - tools/dygrab_secure.py
      - .github/workflows/douyin-secure-login-capture.yml

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  TARGET_BRANCH: archive/douyin-7666692683432429819-secure-20260731

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive/douyin-7666692683432429819-secure-20260731
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate one-time encryption key
        run: |
          python -m pip install --quiet cryptography
          mkdir -p handshake
          python - <<'PY'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          key = rsa.generate_private_key(public_exponent=65537, key_size=3072)
          Path('/tmp/douyin_private.pem').write_bytes(key.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.PKCS8,
              serialization.NoEncryption(),
          ))
          Path('handshake/public.pem').write_bytes(key.public_key().public_bytes(
              serialization.Encoding.PEM,
              serialization.PublicFormat.SubjectPublicKeyInfo,
          ))
          Path('handshake/run_id.txt').write_text(os.environ['GITHUB_RUN_ID'] + '\n', encoding='utf-8')
          Path('handshake/status.txt').write_text('waiting_for_encrypted_login\n', encoding='utf-8')
          os.chmod('/tmp/douyin_private.pem', 0o600)
          PY

      - name: Publish one-time public key
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add handshake/public.pem handshake/run_id.txt handshake/status.txt
          git commit -m 'archive: publish one-time encryption public key'
          git push origin HEAD:${TARGET_BRANCH}

      - name: Wait for encrypted login state
        run: |
          set -euo pipefail
          found=0
          for i in $(seq 1 150); do
            git fetch --quiet origin "${TARGET_BRANCH}"
            if git show "origin/${TARGET_BRANCH}:handshake/login.enc.json" > /tmp/login.enc.json 2>/dev/null; then
              found=1
              break
            fi
            sleep 4
          done
          test "$found" = 1

      - name: Decrypt login state in runner memory
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          envelope = json.loads(Path('/tmp/login.enc.json').read_text('utf-8'))
          private_key = serialization.load_pem_private_key(Path('/tmp/douyin_private.pem').read_bytes(), password=None)
          aes_key = private_key.decrypt(
              base64.b64decode(envelope['encrypted_key']),
              padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()), algorithm=hashes.SHA256(), label=None),
          )
          plaintext = AESGCM(aes_key).decrypt(
              base64.b64decode(envelope['nonce']),
              base64.b64decode(envelope['ciphertext']),
              b'douyin-7666692683432429819',
          )
          Path('/tmp/douyin-login.json').write_bytes(plaintext)
          os.chmod('/tmp/douyin-login.json', 0o600)
          obj = json.loads(plaintext)
          assert isinstance(obj.get('cookie'), str) and 'sessionid=' in obj['cookie']
          assert isinstance(obj.get('user_agent'), str) and 'Mozilla/' in obj['user_agent']
          print('Temporary login state decrypted and validated.')
          PY

      - name: Install browser collector
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Capture comments and author images
        env:
          LOGIN_JSON: /tmp/douyin-login.json
        run: python tools/dygrab_secure.py

      - name: Erase temporary login material
        if: always()
        run: |
          rm -f /tmp/douyin-login.json /tmp/douyin_private.pem /tmp/login.enc.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: douyin-secure-comments-7666692683432429819
          path: |
            douyin-login-comments-7666692683432429819.zip
            out/抓取统计.json
            out/登录页面.png
            out/抓取结束.png
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

name: Douyin source quality audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/douyin-quality-audit-bootstrap'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Publish ephemeral key
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          mkdir -p .douyin_quality_exchange "$RUNNER_TEMP/douyin_quality"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/douyin_quality/private.pem"
          openssl pkey -in "$RUNNER_TEMP/douyin_quality/private.pem" -pubout -out .douyin_quality_exchange/public_key.pem
          printf '%s\n' '${{ github.run_id }}' > .douyin_quality_exchange/run_id.txt
          git rm -f .github/douyin-quality-audit-bootstrap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .douyin_quality_exchange
          git commit -m "Publish quality audit exchange key"
          git push origin "HEAD:${HEAD_REF}"

      - name: Wait for encrypted login payload
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            git fetch origin "$HEAD_REF" --quiet
            if git show "origin/${HEAD_REF}:.douyin_quality_exchange/payload.json" > "$RUNNER_TEMP/douyin_quality/payload.json" 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install cryptography requests playwright
          python -m playwright install --with-deps chromium

      - name: Decrypt authorized login request
        run: |
          mkdir -p .private
          python - <<'PY'
          import base64,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root=Path(os.environ['RUNNER_TEMP'])/'douyin_quality'
          obj=json.loads((root/'payload.json').read_text())
          key=serialization.load_pem_private_key((root/'private.pem').read_bytes(),password=None)
          aes=key.decrypt(base64.b64decode(obj['wrapped_key']),padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          plain=AESGCM(aes).decrypt(base64.b64decode(obj['nonce']),base64.b64decode(obj['ciphertext']),b'douyin-quality-audit-19870927XU')
          Path('.private/douyin_login_curl.txt').write_bytes(plain)
          PY

      - name: Audit source variants
        run: python tools/douyin_quality_audit.py

      - name: Remove plaintext credentials
        if: always()
        run: rm -rf .private "$RUNNER_TEMP/douyin_quality/private.pem" "$RUNNER_TEMP/douyin_quality/payload.json"

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-quality-audit-7669428426503145343
          path: quality_audit/
          retention-days: 3
          compression-level: 0
